version: 2

models:

  # =========================================================================
  # STAGING LAYER (stg_*)
  # =========================================================================
  - name: stg_customers
    description: "Cleaned Olist customers staging view."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        tests:
          - not_null

  - name: stg_orders
    description: "Cleaned Olist orders staging view with standardized timestamps."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved

  - name: stg_order_items
    description: "Cleaned Olist order items staging view."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null

  - name: stg_order_payments
    description: "Cleaned Olist order payments staging view."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined

  - name: stg_order_reviews
    description: "Cleaned Olist order reviews staging view."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_products
    description: "Cleaned Olist products staging view."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_sellers
    description: "Cleaned Olist sellers staging view."
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

  - name: stg_product_category_translation
    description: "Portuguese to English product category mapping."
    columns:
      - name: product_category_name
        tests:
          - not_null
          - unique

  # =========================================================================
  # INTERMEDIATE / CORE LAYER (core_*)
  # =========================================================================
  - name: core_orders
    description: "Core order and customer model."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: customer_unique_id
        tests:
          - not_null

  - name: core_order_items
    description: "Core order item model with product and seller information."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('core_orders')
              field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id

  - name: core_order_payments
    description: "Core payment model linked to orders and customers."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: core_order_reviews
    description: "Core review model linked to orders and customers."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: core_product_categories
    description: "Core products joined with English category translations."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  # =========================================================================
  # ANALYTICAL MARTS (mart_* — 9 Existing Marts)
  # =========================================================================
  - name: mart_sales
    description: "Order-item level sales analysis model."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null
      - name: total_item_value
        tests:
          - not_null

  - name: mart_customer_behavior
    description: "Customer-level repeat order and retention analysis mart."
    columns:
      - name: customer_unique_id
        tests:
          - not_null
          - unique
      - name: total_orders
        tests:
          - not_null

  - name: mart_customer_reviews
    description: "Customer-level aggregated review score and sentiment counts."
    columns:
      - name: customer_unique_id
        tests:
          - not_null
          - unique
      - name: total_reviews
        tests:
          - not_null

  - name: mart_delivery_performance
    description: "Order-level delivery performance and delay days calculation."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null

  - name: mart_enriched_review_analysis
    description: "AI-enriched review analysis mart combining review data with Groq LLM enrichment."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: ai_sentiment
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'neutral', 'negative']

  - name: mart_payment_analysis
    description: "Payment method level revenue and installment summary mart."
    columns:
      - name: payment_type
        tests:
          - not_null
          - unique
      - name: total_orders
        tests:
          - not_null
      - name: total_payment_value
        tests:
          - not_null

  - name: mart_product_performance
    description: "Product-level sales, freight, and order volume mart."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: total_sales_value
        tests:
          - not_null

  - name: mart_review_analysis
    description: "Order review analysis mart with rule-based sentiment categories."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_sentiment_category
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'neutral', 'negative']

  - name: mart_seller_performance
    description: "Seller-level revenue, item volume, and freight mart."
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique
      - name: total_sales_value
        tests:
          - not_null

  # =========================================================================
  # DIMENSIONAL STAR SCHEMA GOLD LAYER (dim_* and fact_*)
  # =========================================================================
  - name: dim_customer
    description: "Star Schema customer dimension at unique customer grain."
    columns:
      - name: customer_unique_id
        tests:
          - not_null
          - unique
      - name: customer_state
        tests:
          - not_null

  - name: dim_product
    description: "Star Schema product dimension with Portuguese and English category names."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: dim_seller
    description: "Star Schema seller dimension with location and lifetime metrics."
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

  - name: dim_date
    description: "Star Schema calendar dimension table."
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null
          - unique

  - name: dim_location
    description: "Star Schema Brazilian zip-code prefix geolocation dimension."
    columns:
      - name: zip_code_prefix
        tests:
          - not_null
          - unique

  - name: dim_payment
    description: "Star Schema payment method dimension."
    columns:
      - name: payment_type
        tests:
          - not_null
          - unique

  - name: dim_review
    description: "Star Schema review dimension with AI enrichment attributes."
    columns:
      - name: review_id
        tests:
          - not_null
          - unique

  - name: fact_order_items
    description: "Star Schema order-item fact table (grain: one row per order_id, order_item_id)."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_seller')
              field: seller_id
      - name: total_item_value
        tests:
          - not_null

  - name: fact_sales
    description: "Star Schema sales fact table (alias of fact_order_items at order-item grain)."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: total_item_value
        tests:
          - not_null

  - name: fact_payments
    description: "Star Schema order payment fact table (grain: order_id, payment_sequential)."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          - relationships:
              to: ref('dim_payment')
              field: payment_type

  - name: fact_reviews
    description: "Star Schema customer review fact table (grain: review_id, order_id)."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]